<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>University Grade Entry System</title>
	</head>

	<body>
		<h1>University Grade Entry System</h1>

		<!-- _________________________STUDENT_________________________ -->
		<form id="studentCreateForm">
			<label for="studentCreateName">Student Name:</label>
			<input
				type="text"
				id="studentCreateName"
				name="studentCreateName"
				required
			/>
			<label for="studentCreateEmail">Student Email:</label>
			<input
				type="email"
				id="studentCreateEmail"
				name="studentCreateEmail"
				required
			/>
			<button type="submit">Create Student</button>
		</form>
		<p id="studentCreateMessage"></p>

		<form id="studentDeleteForm">
			<label for="studentDeleteSelect">Student:</label>
			<select
				id="studentDeleteSelect"
				name="studentDeleteSelect"
				required
			>
				<option value="" disabled selected>Select a student</option>
			</select>
			<button type="submit">Delete Student</button>
		</form>
		<p id="studentDeleteMessage"></p>

		<form id="studentPatchForm">
			<label for="studentPatchSelect">Student:</label>
			<select id="studentPatchSelect" name="studentPatchSelect" required>
				<option value="" disabled selected>Select a student</option>
			</select>
			<label for="studentPatchName">Student Name:</label>
			<input type="text" id="studentPatchName" name="studentPatchName" />
			<label for="studentPatchEmail">Student Email:</label>
			<input
				type="email"
				id="studentPatchEmail"
				name="studentPatchEmail"
			/>
			<button type="submit">Update Student</button>
		</form>
		<p id="studentPatchMessage"></p>

		<!-- _________________________COURSE_________________________ -->
		<form id="courseCreateForm">
			<label for="courseCreateName">Course Name:</label>
			<input
				type="text"
				id="courseCreateName"
				name="courseCreateName"
				required
			/>
			<button type="submit">Create Course</button>
		</form>
		<p id="courseCreateMessage"></p>

		<form id="courseDeleteForm">
			<label for="courseDeleteSelect">Course:</label>
			<select id="courseDeleteSelect" name="courseDeleteSelect" required>
				<option value="" disabled selected>Select a course</option>
			</select>
			<button type="submit">Delete Course</button>
		</form>
		<p id="courseDeleteMessage"></p>

		<form id="coursePatchForm">
			<label for="coursePatchSelect">Course:</label>
			<select id="coursePatchSelect" name="coursePatchSelect" required>
				<option value="" disabled selected>Select a course</option>
			</select>
			<label for="coursePatchName">Course Name:</label>
			<input
				type="text"
				id="coursePatchName"
				name="coursePatchName"
				required
			/>
			<button type="submit">Update Course</button>
		</form>
		<p id="coursePatchMessage"></p>

		<!-- _________________________ENROLLMENT_________________________ -->
		<form id="enrollmentCreateForm">
			<label for="enrollmentCreateSelectStudent">Student:</label>
			<select
				id="enrollmentCreateSelectStudent"
				name="enrollmentCreateSelectStudent"
				required
			>
				<option value="" disabled selected>Select a student</option>
			</select>
			<label for="enrollmentCreateSelectCourse">Course:</label>
			<select
				id="enrollmentCreateSelectCourse"
				name="enrollmentCreateSelectCourse"
				required
			>
				<option value="" disabled selected>Select a course</option>
			</select>
			<button type="submit">Enroll</button>
		</form>
		<p id="enrollmentCreateMessage"></p>

		<form id="enrollmentDeleteForm">
			<label for="enrollmentDeleteSelectStudent">Student:</label>
			<select
				id="enrollmentDeleteSelectStudent"
				name="enrollmentDeleteSelectStudent"
				required
			>
				<option value="" disabled selected>Select a student</option>
			</select>
			<label for="enrollmentDeleteSelectCourse">Course:</label>
			<select
				id="enrollmentDeleteSelectCourse"
				name="enrollmentDeleteSelectCourse"
				required
			>
				<option value="" disabled selected>Select a course</option>
			</select>
			<button type="submit">Unenroll</button>
		</form>
		<p id="enrollmentDeleteMessage"></p>

		<form id="enrollmentPatchForm">
			<label for="enrollmentPatchSelectStudent">Student:</label>
			<select
				id="enrollmentPatchSelectStudent"
				name="enrollmentPatchSelectStudent"
				required
			>
				<option value="" disabled selected>Select a student</option>
			</select>
			<label for="enrollmentPatchSelectCourse">Course:</label>
			<select
				id="enrollmentPatchSelectCourse"
				name="enrollmentPatchSelectCourse"
				required
			>
				<option value="" disabled selected>Select a course</option>
			</select>
			<label for="enrollmentPatchGrade">Grade:</label>
			<input
				type="number"
				id="enrollmentPatchGrade"
				name="enrollmentPatchGrade"
				min="0"
				max="0"
				step="any"
				required
			/>
			<button type="submit">Update Grade</button>
		</form>
		<p id="enrollmentPatchMessage"></p>

		<!-- _________________________STUDENT DISPLAY_________________________ -->
		<section>
			<h2>Students and Grades</h2>
			<ul id="loadStudentsList"></ul>
			<p id="loadStudentsMessage"></p>
		</section>

		<script src="/static/script.js"></script>
	</body>
</html>
